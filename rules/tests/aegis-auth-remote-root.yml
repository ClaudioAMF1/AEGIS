# Regression cases for aegis-auth-remote-root. Events are completed with defaults by the test runner.
rule: aegis-auth-remote-root
match:
- category: authentication
  action: login_success
  auth:
    method: password
    outcome: success
    source_ip: 203.0.113.9
    target_user: root
    service: sshd
no_match:
- category: authentication
  action: login_success
  auth:
    method: password
    outcome: success
    source_ip: 127.0.0.1
    target_user: root
    service: sshd
- category: authentication
  action: login_success
  auth:
    method: password
    outcome: success
    source_ip: 203.0.113.9
    target_user: deploy
    service: sshd
