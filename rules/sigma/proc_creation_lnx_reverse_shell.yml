title: Reverse Shell Command Line
id: aegis-lnx-reverse-shell
status: stable
description: Command line patterns used to connect an interactive shell to a remote listener.
references:
  - https://attack.mitre.org/techniques/T1059/004/
author: AEGIS
tags:
  - attack.execution
  - attack.t1059.004
  - attack.command_and_control
  - attack.t1071
logsource:
  product: linux
  category: process_creation
detection:
  devtcp:
    CommandLine|contains|all:
      - '/dev/tcp/'
      - '-i'
  netcat_exec:
    Image|endswith:
      - /nc
      - /ncat
      - /netcat
    CommandLine|contains:
      - ' -e '
      - ' -c '
  python_socket:
    CommandLine|contains|all:
      - 'socket'
      - 'subprocess'
      - 'connect'
  condition: devtcp or netcat_exec or python_socket
falsepositives:
  - Penetration tests and red-team exercises in authorised labs
level: critical
