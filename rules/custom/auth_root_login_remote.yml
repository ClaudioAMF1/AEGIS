title: Remote Root Login
id: aegis-auth-remote-root
status: stable
description: The root account authenticated over SSH from a remote address.
author: AEGIS
tags:
  - attack.initial_access
  - attack.t1078.003
logsource:
  product: aegis
  category: authentication
detection:
  selection:
    action: login_success
    auth.service: sshd
    auth.target_user: root
  local:
    auth.source_ip|cidr:
      - 127.0.0.0/8
      - ::1/128
  condition: selection and not local
falsepositives:
  - Break-glass access by administrators
level: high
