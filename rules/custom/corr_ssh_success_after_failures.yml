title: SSH Login Success Following Failures
id: aegis-corr-ssh-success-after-failures
status: stable
description: |
  A successful SSH login from a source that previously failed to authenticate on the same host
  within 10 minutes. Combined with the brute-force alert this suggests compromised credentials.
author: AEGIS
tags:
  - attack.credential_access
  - attack.t1110
  - attack.initial_access
  - attack.t1078
correlation:
  type: temporal_ordered
  rules:
    - ssh_login_failure
    - ssh_login_success
  group-by:
    - auth.source_ip
    - host.hostname
  timespan: 10m
falsepositives:
  - Users mistyping their password before succeeding
level: medium
