title: SSH Password Spraying
id: aegis-corr-ssh-password-spray
status: stable
description: One source tried five or more distinct accounts on a host within 10 minutes.
author: AEGIS
tags:
  - attack.credential_access
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - ssh_login_failure
  group-by:
    - auth.source_ip
    - host.hostname
  timespan: 10m
  condition:
    field: auth.target_user
    gte: 5
level: high
